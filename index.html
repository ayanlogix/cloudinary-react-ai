<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloudinary AI React App</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#0d0d1a;color:#e0e0e0;min-height:100vh}
.app{max-width:1000px;margin:0 auto;padding:40px 20px}
h1{font-size:2.2rem;font-weight:900;text-align:center;margin-bottom:8px;background:linear-gradient(135deg,#ff6b35,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:#666;margin-bottom:40px}
.panel{background:rgba(255,255,255,0.04);border:1px solid rgba(255,107,53,0.2);border-radius:16px;padding:28px;margin-bottom:24px}
.panel h2{font-size:1rem;margin-bottom:16px;color:#ff6b35}
input,select{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:10px 14px;color:#e0e0e0;font-size:0.9rem;font-family:'Inter',sans-serif;width:100%;margin-bottom:10px}
.btn{padding:12px 24px;border-radius:10px;font-weight:700;cursor:pointer;border:none;background:linear-gradient(135deg,#ff6b35,#ffd700);color:#000;font-size:0.95rem;width:100%;margin-top:6px;transition:all 0.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(255,107,53,0.4)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
.img-box{background:rgba(0,0,0,0.3);border-radius:12px;padding:12px;text-align:center}
.img-box p{font-size:0.75rem;color:#888;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.img-box img{width:100%;border-radius:8px;max-height:250px;object-fit:contain}
.url{font-size:0.7rem;color:#555;word-break:break-all;margin-top:8px;font-family:monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{padding:6px 14px;border-radius:20px;font-size:0.8rem;cursor:pointer;border:1px solid rgba(255,107,53,0.3);background:rgba(255,107,53,0.08);color:#ff6b35;transition:all 0.2s}
.chip.active,.chip:hover{background:rgba(255,107,53,0.3)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const AI_EFFECTS = [
  {label:"Background Removal",value:"e_background_removal"},
  {label:"Cartoonify",value:"e_cartoonify"},
  {label:"Art: Athena",value:"e_art:athena"},
  {label:"Art: Hokusai",value:"e_art:hokusai"},
  {label:"Enhance",value:"e_enhance"},
  {label:"Upscale",value:"e_upscale"},
  {label:"Restore",value:"e_restore"},
  {label:"Grayscale",value:"e_grayscale"},
  {label:"Sepia",value:"e_sepia"},
  {label:"Viesus Correct",value:"e_viesus_correct"},
];

function App() {
  const [cloud, setCloud] = useState("demo");
  const [publicId, setPublicId] = useState("sample");
  const [effect, setEffect] = useState("e_background_removal");
  const [originalUrl, setOriginalUrl] = useState("https://res.cloudinary.com/demo/image/upload/sample.jpg");
  const [transformedUrl, setTransformedUrl] = useState("");
  const [applied, setApplied] = useState(false);

  const apply = () => {
    const orig = `https://res.cloudinary.com/${cloud}/image/upload/${publicId}.jpg`;
    const trans = `https://res.cloudinary.com/${cloud}/image/upload/${effect}/${publicId}.jpg`;
    setOriginalUrl(orig);
    setTransformedUrl(trans);
    setApplied(true);
  };

  return (
    <div className="app">
      <h1>Cloudinary AI React App</h1>
      <p className="subtitle">AI-powered image transformations using Cloudinary - Built with React</p>

      <div className="panel">
        <h2>Configuration</h2>
        <input value={cloud} onChange={e=>setCloud(e.target.value)} placeholder="Cloud name (e.g. demo)" />
        <input value={publicId} onChange={e=>setPublicId(e.target.value)} placeholder="Image public ID (e.g. sample)" />
        <h2 style={{marginTop:'16px',marginBottom:'12px'}}>AI Effect</h2>
        <div className="chips">
          {AI_EFFECTS.map(e=>(
            <span key={e.value} className={`chip${effect===e.value?' active':''}`} onClick={()=>setEffect(e.value)}>
              {e.label}
            </span>
          ))}
        </div>
        <button className="btn" onClick={apply}>Apply AI Transformation</button>
      </div>

      {applied && (
        <div className="grid">
          <div className="img-box">
            <p>Original</p>
            <img src={originalUrl} alt="original" onError={e=>e.target.src='https://via.placeholder.com/300x200?text=Original'} />
            <div className="url">{originalUrl}</div>
          </div>
          <div className="img-box">
            <p>AI Transformed</p>
            <img src={transformedUrl} alt="transformed" onError={e=>e.target.src='https://via.placeholder.com/300x200?text=Transformed'} />
            <div className="url">{transformedUrl}</div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
