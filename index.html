<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloudinary AI App</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #050505; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        .app { text-align: center; background: #111; padding: 40px; border-radius: 24px; border: 1px solid #222; max-width: 600px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        h1 { font-size: 2rem; margin-bottom: 10px; background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 30px; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 30px; }
        .chip { background: #1a1a1a; border: 1px solid #333; padding: 10px 20px; border-radius: 50px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; font-weight: 600; }
        .chip:hover, .chip.active { border-color: #00d2ff; background: rgba(0,210,255,0.1); color: #00d2ff; }
        .preview-container { background: #000; border-radius: 16px; padding: 15px; border: 1px solid #222; position: relative; }
        img { width: 100%; border-radius: 8px; transition: 0.5s; opacity: 1; }
        .loading-dot { position: absolute; top: 10px; right: 20px; color: #00d2ff; font-size: 0.7rem; font-weight: 800; }
    </style>
</head>
<body>
    <div class="app">
        <h1>Cloudinary AI Media</h1>
        <p class="subtitle">Cloudinary Media SDK + AI Transformation Engine</p>
        
        <div class="chip-container" id="chips">
            <!-- Chips injected here -->
        </div>

        <div class="preview-container">
            <div class="loading-dot" id="status">● AI ACTIVE</div>
            <img id="main-img" src="https://res.cloudinary.com/demo/image/upload/e_cartoonify/sample.jpg" alt="AI Preview">
        </div>
        
        <p style="margin-top: 25px; font-size: 0.8rem; color: #444;">MLH GenAI Hack Week 2025 Submission</p>
    </div>

    <script>
        const effects = [
            { name: 'Cartoonify', code: 'e_cartoonify' },
            { name: 'Grayscale', code: 'e_grayscale' },
            { name: 'Sepia', code: 'e_sepia' },
            { name: 'Vignette', code: 'e_vignette' },
            { name: 'Oil Paint', code: 'e_oil_paint' }
        ];

        const container = document.getElementById('chips');
        const img = document.getElementById('main-img');
        const status = document.getElementById('status');

        effects.forEach(eff => {
            const el = document.createElement('div');
            el.className = 'chip' + (eff.code === 'e_cartoonify' ? ' active' : '');
            el.innerText = eff.name;
            el.onclick = () => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                el.classList.add('active');
                
                // Show loading state
                img.style.opacity = '0.5';
                status.innerText = '○ PROCESSING...';
                
                // Update Image
                img.src = `https://res.cloudinary.com/demo/image/upload/${eff.code}/sample.jpg`;
                
                img.onload = () => {
                    img.style.opacity = '1';
                    status.innerText = '● AI ACTIVE';
                };
            };
            container.appendChild(el);
        });
    </script>
</body>
</html>
