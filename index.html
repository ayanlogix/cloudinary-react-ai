<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Cloudinary React AI App</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #050505; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .app { text-align: center; background: #111; padding: 40px; border-radius: 24px; border: 1px solid #222; max-width: 600px; width: 90%; }
        h1 { background: linear-gradient(to right, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chip-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .chip { background: #222; border: 1px solid #333; padding: 8px 16px; border-radius: 50px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; }
        .chip:hover { border-color: #00d2ff; background: rgba(0,210,255,0.1); }
        .preview-img { width: 100%; border-radius: 12px; margin-top: 20px; border: 1px solid #333; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        function App() {
            const [effect, setEffect] = React.useState('e_cartoonify');
            const chips = ['Cartoonify', 'Grayscale', 'Sepia', 'Blur', 'Vignette'];
            
            return (
                <div className="app">
                    <h1>Cloudinary React AI</h1>
                    <p style={{color: '#666'}}>React 18 + Cloudinary Media SDK Integration</p>
                    <div className="chip-container">
                        {chips.map(c => (
                            <div key={c} className="chip" onClick={() => setEffect('e_' + c.toLowerCase())}>{c}</div>
                        ))}
                    </div>
                    <img 
                        className="preview-img" 
                        src={`https://res.cloudinary.com/demo/image/upload/${effect}/sample.jpg`} 
                        alt="Preview" 
                    />
                    <p style={{marginTop: '20px', fontSize: '0.8rem', color: '#444'}}>Active Effect: {effect}</p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
